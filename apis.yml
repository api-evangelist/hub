aid: hub
name: Hub
description: Hub (Hub.xyz) is a distributed physical-AI data infrastructure company that
  creates, annotates, and curates custom real-world datasets — egocentric first-person
  video, image, video, and audio — used to train AI and robotics models. Data is sourced
  through a global network of 500,000+ retail contributors and verified small and medium
  businesses across 150+ countries and 100+ languages. Hub offers both off-the-shelf
  labeled datasets and bespoke, custom-scoped data collection projects quoted within
  hours, delivered through a fully managed pipeline that couples automation with
  human-in-the-loop validation for frontier AI labs and Fortune 500 companies.
